[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-capylang"
version = "0.1.0"
description = "Pygments syntax highlighting for Capylang"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pygments>=2.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pygments",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Jokymon/capylang"

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.entry-points."pygments.lexers"]
capylang = "pygments_capylang.lexer:CapylangLexer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
